<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout extend under the iPhone notch/home bar;
         the CSS then pads with env(safe-area-inset-*) so nothing is hidden. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Private, offline money tracker. Your data stays on your device."
    />

    <!-- iOS home-screen app: open full-screen, status bar drawn over our header
         (the header pads for it with safe-area-inset-top). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Money" />

    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS ignores manifest icons for the home screen; it uses this 180x180 PNG. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Money Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
